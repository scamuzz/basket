<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>🏀 Squadre · A.S.D. Visconti Basket Brignano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f5ff; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%);
      color: white; padding: 36px 20px 24px; text-align: center; position: relative; overflow: hidden;
      border-bottom: 4px solid #FFCC00;
    }
    .header::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.08), transparent); }
    .back-link {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 7px 15px; font-size: 0.76rem; font-weight: 700;
      color: white; text-decoration: none; z-index: 2; backdrop-filter: blur(4px);
    }
    .back-link:hover { background: rgba(255,255,255,0.38); }
    .pin-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.22); border: none; border-radius: 50%;
      width: 40px; height: 40px; font-size: 1.3rem; cursor: pointer; z-index: 2;
      backdrop-filter: blur(4px); color: white; transition: background 0.2s;
    }
    .pin-btn:hover { background: rgba(255,255,255,0.38); }
    .header .icons { font-size: 3rem; display: block; margin-bottom: 10px; position: relative; }
    .header h1 { font-size: 1.6rem; font-weight: 800; position: relative; }
    .header .subtitle { font-size: 0.82rem; opacity: 0.9; margin-top: 6px; position: relative; }
    .sync-status { display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 0.7rem; margin-top: 10px; opacity: 0.95; position: relative; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: white; animation: blink 1.5s infinite; flex-shrink: 0; }
    .sync-dot.connected { background: #69f0ae; animation: none; }
    .sync-dot.error { background: #ff5252; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .wave-divider { display: block; line-height: 0; overflow: hidden;
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%); }
    .wave-divider svg { display: block; width: 100%; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px 12px 64px; }

    /* FILTRI */
    .filter-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 8px;
      margin-bottom: 6px; padding-bottom: 4px;
    }
    .filter-btn {
      background: white; border: 2px solid #c5d5f7; border-radius: 20px;
      padding: 6px; font-size: 0.72rem; font-weight: 700; color: #003399;
      cursor: pointer; text-align: center; transition: all 0.2s; font-family: inherit;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #FFCC00; color: #1a3a6c; border-color: #FFCC00;
    }

    /* SECTION TITLE */
    .section-title {
      font-size: 0.78rem; font-weight: 800; color: #003399;
      text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 14px 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title::after { content: ''; flex: 1; height: 2px;
      background: linear-gradient(90deg, #FFCC00 0%, transparent 100%); }
    .category-divider {
      font-size: 0.70rem; font-weight: 800; color: #6b8ab5;
      text-transform: uppercase; letter-spacing: 1px; padding: 10px 0 4px;
    }

    /* ADD PANEL */
    .add-panel {
      display: none; background: #fff8e1; border-radius: 14px;
      padding: 14px; margin-bottom: 14px; border: 2px solid #ffe082;
    }
    .add-panel.visible { display: block; }
    .add-panel h4 { font-size: 0.74rem; color: #f57f17; text-transform: uppercase;
      letter-spacing: 0.9px; font-weight: 800; margin-bottom: 10px; }
    .add-row { display: flex; gap: 8px; }
    .add-input {
      flex: 1; border: 1.5px solid #ffe082; border-radius: 10px;
      padding: 9px 12px; font-size: 0.86rem; font-family: inherit; color: #333; outline: none; background: white;
    }
    .add-input:focus { border-color: #FFCC00; }
    .add-btn-small {
      background: linear-gradient(135deg, #003399, #1a5fc8); color: white;
      border: none; border-radius: 10px; padding: 9px 16px; font-size: 0.86rem;
      font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .add-btn-small:hover { opacity: 0.9; }

    /* PLAYER LIST */
    .player-item {
      background: white; border-radius: 12px; padding: 11px 14px;
      margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,51,153,0.06); border: 2px solid #c5d5f7;
    }
    .player-name { font-size: 0.88rem; font-weight: 700; color: #1a3a6c; }
    .player-group-badge {
      font-size: 0.60rem; font-weight: 800; padding: 2px 8px; border-radius: 8px; margin-left: 8px;
    }
    .badge-femm { background: #fff0f5; color: #8b0040; }
    .badge-masc { background: #edf1ff; color: #003399; }
    .badge-ann  { background: #e8f4ff; color: #1a5fc8; }
    .badge-mini { background: #fffde0; color: #7a5f00; }
    .player-del-btn {
      background: none; border: none; color: #c5d5f7; cursor: pointer;
      font-size: 1rem; transition: color 0.2s; padding: 2px 4px;
    }
    .player-del-btn:hover { color: #e53935; }
    .no-items { text-align: center; font-size: 0.88rem; color: #90a4ae; font-style: italic;
      padding: 24px 10px; background: white; border-radius: 14px;
      border: 2px dashed #c5d5f7; margin-bottom: 16px; }

    /* PIN MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 300px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .modal h3 { font-size: 1rem; font-weight: 800; color: #003399; margin-bottom: 8px; }
    .modal p { font-size: 0.78rem; color: #607d8b; margin-bottom: 16px; }
    .modal input { width: 100%; border: 2px solid #c5d5f7; border-radius: 10px;
      padding: 11px 40px 11px 14px; font-size: 1rem; text-align: center;
      letter-spacing: 2px; outline: none; font-family: inherit; }
    .modal input:focus { border-color: #003399; }
    .pin-input-wrap { position: relative; }
    .pin-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; line-height: 1; }
    .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: 10px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .modal-btn.primary { background: linear-gradient(135deg, #003399, #1a5fc8); color: white; }
    .modal-btn.secondary { background: #eceff1; color: #607d8b; }
    .modal-error { font-size: 0.75rem; color: #e53935; margin-top: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #003399; color: white; padding: 10px 22px; border-radius: 24px;
      font-size: 0.83rem; font-weight: 600; transition: transform 0.3s ease; z-index: 999;
      box-shadow: 0 6px 24px rgba(0,51,153,0.3); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .page-footer { text-align: center; font-size: 0.7rem; color: #aabbc8; padding: 20px 0; }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">&#8592; Home</a>
  <button class="pin-btn" id="pin-btn">🔒</button>
  <span class="icons">🏀</span>
  <h1>Squadre</h1>
  <div class="subtitle">Tutte le squadre A.S.D. Visconti Basket Brignano</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso…</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#f0f5ff"/>
  </svg>
</div>

<div class="container">

  <!-- FILTRO CATEGORIA -->
  <div class="filter-row" id="cat-row">
    <button class="filter-btn active" data-cat="tutti">Tutte</button>
    <button class="filter-btn" data-cat="Femminili">♀ Femminili</button>
    <button class="filter-btn" data-cat="Senior">♂ Senior</button>
    <button class="filter-btn" data-cat="Giovanili">🏀 Giovanili</button>
    <button class="filter-btn" data-cat="Minibasket">⭐ Mini</button>
  </div>
  <!-- FILTRO SQUADRA -->
  <div class="filter-row" id="group-row"></div>

  <div id="players-container"></div>
</div>

<div class="page-footer">🏀 Squadre · A.S.D. Visconti Basket Brignano</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>🔑 Accesso Amministratore</h3>
    <p>Inserisci il PIN per gestire i giocatori</p>
    <div class="pin-input-wrap">
      <input type="password" id="pin-input" placeholder="••••••••" maxlength="20" autocomplete="current-password"/>
      <button class="pin-toggle" id="pin-toggle" type="button">👁️</button>
    </div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-btns">
      <button class="modal-btn secondary" id="modal-cancel">Annulla</button>
      <button class="modal-btn primary" id="modal-confirm">Accedi</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
  authDomain: "lista-spesa-b9eb1.firebaseapp.com",
  databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lista-spesa-b9eb1",
  storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
  messagingSenderId: "468690890938",
  appId: "1:468690890938:web:048be7f27779d8862d9283"
});
const db = firebase.database();
const giocatoriRef = db.ref('basket/giocatori');

const GROUPS = [
  { key: 'prom_f', label: 'Promozione ♀',  shortLabel: 'Prom ♀',    category: 'Femminili', badgeClass: 'badge-femm' },
  { key: 'u17_f',  label: 'Under 17 ♀',    shortLabel: 'U17 ♀',     category: 'Femminili', badgeClass: 'badge-femm' },
  { key: 'u15_f',  label: 'Under 15 ♀',    shortLabel: 'U15 ♀',     category: 'Femminili', badgeClass: 'badge-femm' },
  { key: 'dr1',    label: 'Div. Reg. 1 ♂', shortLabel: 'DR1 ♂',    category: 'Senior',  badgeClass: 'badge-masc' },
  { key: 'dr4',    label: 'Div. Reg. 4 ♂', shortLabel: 'DR4 ♂',    category: 'Senior',  badgeClass: 'badge-masc' },
  { key: 'a2010',  label: '2010',            shortLabel: '2010',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'a2011',  label: '2011',            shortLabel: '2011',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'a2012',  label: '2012',            shortLabel: '2012',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'a2013',  label: '2013',            shortLabel: '2013',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'a2014',  label: '2014',            shortLabel: '2014',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'a2015',  label: '2015',            shortLabel: '2015',      category: 'Giovanili',    badgeClass: 'badge-ann' },
  { key: 'm2016',  label: 'Mini 2016',       shortLabel: 'Mini 2016', category: 'Minibasket', badgeClass: 'badge-mini' },
  { key: 'm2017',  label: 'Mini 2017',       shortLabel: 'Mini 2017', category: 'Minibasket', badgeClass: 'badge-mini' },
  { key: 'm2018',  label: 'Mini 2018',       shortLabel: 'Mini 2018', category: 'Minibasket', badgeClass: 'badge-mini' },
  { key: 'm2019',  label: 'Mini 2019',       shortLabel: 'Mini 2019', category: 'Minibasket', badgeClass: 'badge-mini' },
  { key: 'm2021',  label: 'Mini 2020-21',    shortLabel: 'Mini 20-21', category: 'Minibasket', badgeClass: 'badge-mini' },
  { key: 'm2023',  label: 'Mini 2022-23',    shortLabel: 'Mini 22-23', category: 'Minibasket', badgeClass: 'badge-mini' },
];

function isManager() { return localStorage.getItem('basketManager') === '1'; }
function setManager(v) { localStorage.setItem('basketManager', v ? '1' : '0'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

let allPlayers = {};
let activeCat = 'tutti';
let activeGroup = 'tutti';

db.ref('.info/connected').on('value', snap => {
  const dot = document.getElementById('sync-dot'), lbl = document.getElementById('sync-label');
  if (snap.val()) { dot.className='sync-dot connected'; lbl.textContent='✅ Sincronizzato in tempo reale'; }
  else { dot.className='sync-dot error'; lbl.textContent='❌ Offline – riconnessione…'; }
});
giocatoriRef.on('value', snap => { allPlayers = snap.val() || {}; render(); });

function buildGroupRow() {
  const row = document.getElementById('group-row');
  row.innerHTML = '';
  const visibleGroups = activeCat === 'tutti' ? GROUPS : GROUPS.filter(g => g.category === activeCat);
  if (visibleGroups.length <= 1) { row.style.display = 'none'; return; }
  row.style.display = 'flex';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (activeGroup === 'tutti' ? ' active' : '');
  allBtn.dataset.group = 'tutti'; allBtn.textContent = 'Tutte';
  row.appendChild(allBtn);
  visibleGroups.forEach(g => {
    const b = document.createElement('button');
    b.className = 'filter-btn' + (activeGroup === g.key ? ' active' : '');
    b.dataset.group = g.key; b.textContent = g.shortLabel;
    row.appendChild(b);
  });
  row.querySelectorAll('.filter-btn').forEach(b => b.addEventListener('click', () => {
    activeGroup = b.dataset.group;
    buildGroupRow(); render();
  }));
}

function render() {
  buildGroupRow();
  const container = document.getElementById('players-container');
  container.innerHTML = '';
  const admin = isManager();

  if (activeGroup === 'tutti') {
    container.innerHTML = '<div class="no-items">👆 Seleziona una squadra per vedere i giocatori</div>';
    return;
  }

  const visibleGroups = GROUPS.filter(g => g.key === activeGroup);

  const categories = [...new Set(visibleGroups.map(g => g.category))];
  const showCatDivider = categories.length > 1;

  categories.forEach(cat => {
    if (showCatDivider) {
      const divider = document.createElement('div');
      divider.className = 'category-divider'; divider.textContent = `── ${cat}`;
      container.appendChild(divider);
    }
    visibleGroups.filter(g => g.category === cat).forEach(group => {
      const groupData = allPlayers[group.key] || {};
      const entries = Object.entries(groupData).sort((a,b)=>(a[1].nome||'').localeCompare(b[1].nome||''));

      const title = document.createElement('div');
      title.className = 'section-title'; title.textContent = group.label;
      container.appendChild(title);

      if (admin) {
        const addPanel = document.createElement('div');
        addPanel.className = 'add-panel visible';
        addPanel.innerHTML = `<h4>➕ Aggiungi giocatore – ${group.shortLabel}</h4>
          <div class="add-row">
            <input type="text" class="add-input" id="add-input-${group.key}" placeholder="Nome e cognome…" maxlength="60"/>
            <button class="add-btn-small" data-group="${group.key}">Aggiungi</button>
          </div>`;
        container.appendChild(addPanel);
      }

      const list = document.createElement('div');
      if (entries.length === 0) {
        list.innerHTML = '<div class="no-items">Nessun giocatore in questa lista. 🏀</div>';
      } else {
        entries.forEach(([id, p]) => {
          const item = document.createElement('div');
          item.className = 'player-item';
          item.innerHTML = `
            <div style="display:flex;align-items:center;">
              <span class="player-name">${esc(p.nome)}</span>
              <span class="player-group-badge ${group.badgeClass}">${esc(group.shortLabel)}</span>
            </div>
            ${admin ? `<button class="player-del-btn" data-group="${group.key}" data-id="${esc(id)}" title="Rimuovi">🗑️</button>` : ''}`;
          list.appendChild(item);
        });
      }
      container.appendChild(list);
    });
  });

  if (admin) {
    container.querySelectorAll('.add-btn-small').forEach(btn => {
      btn.addEventListener('click', () => {
        const grp = btn.dataset.group;
        const input = document.getElementById('add-input-' + grp);
        const nome = input.value.trim();
        if (!nome) { showToast('⚠️ Inserisci il nome del giocatore!'); return; }
        giocatoriRef.child(grp).push({ nome })
          .then(() => { input.value = ''; showToast('✅ Giocatore aggiunto!'); })
          .catch(() => showToast('❌ Errore nel salvataggio'));
      });
    });
    container.querySelectorAll('.player-del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm('Rimuovere questo giocatore dalla lista?')) {
          giocatoriRef.child(btn.dataset.group).child(btn.dataset.id).remove()
            .then(() => showToast('✅ Giocatore rimosso'))
            .catch(() => showToast('❌ Errore nella rimozione'));
        }
      });
    });
  }
}

// Filtri categoria
document.querySelectorAll('#cat-row .filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    activeCat = b.dataset.cat; activeGroup = 'tutti';
    document.querySelectorAll('#cat-row .filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); render();
  });
});

// PIN
const pinBtn = document.getElementById('pin-btn');
const overlay = document.getElementById('modal-overlay');
function updatePinBtn() { pinBtn.textContent = isManager() ? '🔐' : '🔒'; }
updatePinBtn();

pinBtn.addEventListener('click', () => {
  if (isManager()) {
    setManager(false); updatePinBtn(); render(); showToast('🔐 Logout gestore effettuato');
  } else {
    document.getElementById('modal-error').textContent = '';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').type = 'password';
    document.getElementById('pin-toggle').textContent = '👁️';
    overlay.classList.add('open');
    setTimeout(() => document.getElementById('pin-input').focus(), 100);
  }
});
document.getElementById('modal-cancel').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.getElementById('modal-confirm').addEventListener('click', checkPin);
document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
document.getElementById('pin-toggle').addEventListener('click', () => {
  const inp = document.getElementById('pin-input'), tog = document.getElementById('pin-toggle');
  if (inp.type === 'password') { inp.type = 'text'; tog.textContent = '🙈'; }
  else { inp.type = 'password'; tog.textContent = '👁️'; }
});
function checkPin() {
  if (document.getElementById('pin-input').value === 'basket2026') {
    setManager(true); overlay.classList.remove('open'); updatePinBtn();
    render(); showToast('🔓 Modalità gestore attiva');
  } else { document.getElementById('modal-error').textContent = '❌ PIN non corretto'; }
}
</script>
</body>
</html>
