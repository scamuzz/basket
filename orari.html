const GIORNI_IT = { lunedi:'Lunedì', martedi:'Martedì', mercoledi:'Mercoledì', giovedi:'Giovedì', venerdi:'Venerdì', sabato:'Sabato', domenica:'Domenica' };
const GIORNI_ORDER = ['lunedi','martedi','mercoledi','giovedi','venerdi','sabato','domenica'];
const GIORNI_DOW = { lunedi:1, martedi:2, mercoledi:3, giovedi:4, venerdi:5, sabato:6, domenica:0 };

function getISOWeek(d) {
  const date = new Date(d); date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7));
  const w1 = new Date(date.getFullYear(), 0, 4);
  const wk = 1 + Math.round(((date - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return `${date.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function weekStart(wk) {
  const [yr, w] = wk.split('-W').map(Number);
  const simple = new Date(yr, 0, 1 + (w - 1) * 7);
  const dow = simple.getDay();
  const mon = new Date(simple); mon.setDate(simple.getDate() - ((dow + 6) % 7));
  return mon;
}
function getCurrentWeekKey() {
  const now = new Date();
  if (now.getDay() === 0) { const nxt = new Date(now); nxt.setDate(now.getDate()+1); return getISOWeek(nxt); }
  return getISOWeek(now);
}
function getNextWeekKey(cur) { const s = weekStart(cur); s.setDate(s.getDate()+7); return getISOWeek(s); }
function formatDate(d) { return d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit' }); }
function capitalizeFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function parseOrario(orario) {
  const m = orario.match(/^(\d{2}:\d{2})[–\-](\d{2}:\d{2})$/);
  return m ? [m[1], m[2]] : ['', ''];
}
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

let currentWeekKey = getCurrentWeekKey();
let nextWeekKey = getNextWeekKey(currentWeekKey);
let weekData = {};
let defaultData = {};
let activeFilter = 'all';

function populateTeamSelect(catValue) {
  const sel = document.getElementById('team-select');
  sel.innerHTML = '<option value="all">— Seleziona una squadra —</option>';
  const groups = catValue ? GROUPS.filter(g => g.category === catValue) : GROUPS;
  groups.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.key;
    opt.textContent = g.label;
    sel.appendChild(opt);
  });
}

(function() {
  const savedTeam = localStorage.getItem('basketTeam');
  if (savedTeam) {
    const valid = savedTeam === 'all' || GROUPS.some(x => x.key === savedTeam);
    if (valid) activeFilter = savedTeam;
  }
  const savedCat = activeFilter !== 'all'
    ? (GROUPS.find(x => x.key === activeFilter) || {}).category || ''
    : '';
  document.getElementById('cat-select').value = savedCat;
  populateTeamSelect(savedCat);
  document.getElementById('team-select').value = activeFilter;
  document.getElementById('team-row').style.display = savedCat ? 'flex' : 'none';
})();

document.getElementById('week-label').textContent = (() => {
  const s = weekStart(currentWeekKey); const e = new Date(s); e.setDate(s.getDate()+6);
  return `${formatDate(s)} – ${formatDate(e)}`;
})();

document.getElementById('cat-select').addEventListener('change', function() {
  populateTeamSelect(this.value);
  activeFilter = 'all';
  document.getElementById('team-select').value = 'all';
  document.getElementById('team-row').style.display = this.value ? 'flex' : 'none';
  localStorage.setItem('basketTeam', activeFilter);
  renderSchedule();
});

document.getElementById('team-select').addEventListener('change', function() {
  activeFilter = this.value;
  localStorage.setItem('basketTeam', activeFilter);
  renderSchedule();
});

function listenWeek(wk) {
  db.ref(`basket/orari/${wk}`).on('value', snap => { weekData[wk] = snap.val() || {}; renderSchedule(); });
}
listenWeek(currentWeekKey);
listenWeek(nextWeekKey);
db.ref('basket/orari/default').on('value', snap => {
  defaultData = snap.val() || {};
  renderSchedule();
  if (isManager()) buildEditForm();
});

function getEffectiveDefaults(gruppo) {
  return defaultData[gruppo] || {};
}
function mergeWithDefaults(weekObj, gruppo) {
  const def = getEffectiveDefaults(gruppo);
  const ov = (weekObj[gruppo]) || {};
  const result = {};
  for (const day of new Set([...Object.keys(def), ...Object.keys(ov)])) {
    result[day] = Object.assign({}, def[day] || {}, ov[day] || {});
  }
  return result;
}

function renderSchedule() {
  const container = document.getElementById('schedule-container');
  container.innerHTML = '';

  const catSel = document.getElementById('cat-select').value;
  if (!catSel) {
    container.innerHTML = '<div class="select-prompt">👆 Seleziona una categoria per vedere gli orari</div>';
    return;
  }

  if (activeFilter === 'all') {
    container.innerHTML = '<div class="select-prompt">👆 Seleziona una squadra per vedere gli orari</div>';
    return;
  }

  const wkData = weekData[currentWeekKey] || {};
  const nxData = weekData[nextWeekKey] || {};
  const wkStart = weekStart(currentWeekKey);
  const nxStart = weekStart(nextWeekKey);

  const visibleGroups = GROUPS.filter(g => g.key === activeFilter);

  function renderWeekSection(label, wkObj, wkStartDate, isNext) {
    if (visibleGroups.length === 0) return;
    const sec = document.createElement('div');
    sec.className = 'week-section-label'; sec.textContent = label;
    container.appendChild(sec);

    visibleGroups.forEach(g => {
      const merged = mergeWithDefaults(wkObj, g.key);
      const defaults = getEffectiveDefaults(g.key);
      const weekOverrides = (wkObj[g.key]) || {};

      const card = document.createElement('div');
      card.className = 'gruppo-card'; card.dataset.gruppo = g.key;

      const daysFound = GIORNI_ORDER.filter(giorno => {
        const info = merged[giorno];
        const defInfo = defaults[giorno];
        const ovInfo = weekOverrides[giorno];
        const isCancelled = defInfo && defInfo.attivo && ovInfo && ovInfo.attivo === false;
        if (isManager()) return true;
        if (!info) return false;
        if (!info.attivo && !isCancelled) return false;
        return true;
      });

      let daysHtml = '';
      GIORNI_ORDER.forEach(giorno => {
        const info = merged[giorno];
        const defInfo = defaults[giorno];
        const ovInfo = weekOverrides[giorno];
        const isCancelled = defInfo && defInfo.attivo && ovInfo && ovInfo.attivo === false;
        if (!isManager()) {
          if (!info || (!info.attivo && !isCancelled)) return;
        }
        const dow = GIORNI_DOW[giorno];
        const date = new Date(wkStartDate);
        date.setDate(wkStartDate.getDate() + ((dow - 1 + 7) % 7));

        const hasActiveDefault = defInfo && defInfo.attivo;
        const hasOverriddenTime = ovInfo && ovInfo.orario && hasActiveDefault && ovInfo.orario !== defInfo.orario;
        const isExtraDay = !isManager() && ovInfo && ovInfo.attivo && !hasActiveDefault;
        const isModified = !isManager() && (isCancelled || hasOverriddenTime || isExtraDay);

        let content;
        if (isCancelled) {
          content = `<span class="orario-time cancelled">${info.orario || ''}</span>
            <div class="orario-nota">⚠️ Annullato${ovInfo.nota ? ' – ' + ovInfo.nota : ''}</div>`;
        } else if (!info || !info.attivo) {
          if (!isManager()) return;
          content = `<span class="no-train">— nessun allenamento</span>`;
        } else {
          content = `<span class="orario-time">${info.orario || '—'}</span>`;
          if (info.palestra) content += `<div class="orario-nota">🏛️ ${capitalizeFirst(info.palestra)}</div>`;
          if (info.nota) content += `<div class="orario-nota">${info.nota}</div>`;
          if (hasOverriddenTime) content += `<span class="modified-tag">orario modificato</span>`;
          if (isExtraDay) content += `<span class="modified-tag tag-extra">aggiunto</span>`;
        }

        const extraClass = isCancelled || hasOverriddenTime ? ' modified' : (isExtraDay ? ' extra-day' : '');
        daysHtml += `<div class="day-row${extraClass}">
          <div class="day-name">${GIORNI_IT[giorno]}<div class="day-date">${formatDate(date)}</div></div>
          <div class="orario-info">${content}</div>
        </div>`;
      });

      if (!daysHtml && !isManager()) {
        daysHtml = '<div class="no-train" style="padding:6px 0">Nessun allenamento questa settimana.</div>';
      }

      card.innerHTML = `<div class="gruppo-title">🏀 ${g.label}<span class="gruppo-badge ${g.badgeClass}">${g.category}</span></div>${daysHtml}`;
      container.appendChild(card);
    });
  }

  renderWeekSection('📅 Settimana corrente', wkData, wkStart, false);

  // --- SETTIMANA PROSSIMA: solo variazioni rispetto al default ---
  const nxEnd = new Date(nxStart); nxEnd.setDate(nxStart.getDate() + 6);
  let hasNextDiffs = false;
  const nextCards = [];

  visibleGroups.forEach(g => {
    const defaults = getEffectiveDefaults(g.key);
    const nxOverrides = (nxData[g.key]) || {};
    let daysHtml = '';

    GIORNI_ORDER.forEach(giorno => {
      const defInfo = defaults[giorno];
      const ovInfo  = nxOverrides[giorno];
      if (!ovInfo) return;

      const nxHasActiveDefault = defInfo && defInfo.attivo;
      const nxIsCancelled = nxHasActiveDefault && ovInfo.attivo === false;
      const nxTimeChanged = ovInfo.orario && nxHasActiveDefault && ovInfo.orario !== defInfo.orario;
      const nxIsExtraDay  = ovInfo.attivo && !nxHasActiveDefault;

      if (!nxIsCancelled && !nxTimeChanged && !nxIsExtraDay) return;

      const dow = GIORNI_DOW[giorno];
      const date = new Date(nxStart);
      date.setDate(nxStart.getDate() + (dow - nxStart.getDay() + 7) % 7);
      const nxInfo = Object.assign({}, defInfo || {}, ovInfo);

      let content, rowClass;
      if (nxIsExtraDay) {
        content = `<span class="orario-time">${nxInfo.orario || '—'}</span><span class="modified-tag tag-extra">aggiunto</span>`;
        if (nxInfo.palestra) content += `<div class="orario-nota">🏛️ ${capitalizeFirst(nxInfo.palestra)}</div>`;
        if (nxInfo.nota) content += `<div class="orario-nota">${nxInfo.nota}</div>`;
        rowClass = ' extra-day';
      } else if (nxIsCancelled) {
        content = `<span class="orario-time cancelled">${defInfo.orario || ''}</span>` +
          `<div class="orario-nota">⚠️ Annullato${nxInfo.nota ? ' – ' + nxInfo.nota : ''}</div>`;
        rowClass = ' modified';
      } else {
        content = `<span class="orario-time">${nxInfo.orario || '—'}</span><span class="modified-tag">orario modificato</span>`;
        if (nxInfo.palestra) content += `<div class="orario-nota">🏛️ ${capitalizeFirst(nxInfo.palestra)}</div>`;
        if (nxInfo.nota) content += `<div class="orario-nota">${nxInfo.nota}</div>`;
        rowClass = ' modified';
      }

      daysHtml += `<div class="day-row${rowClass}">
        <div class="day-name">${GIORNI_IT[giorno]}<div class="day-date">${formatDate(date)}</div></div>
        <div class="orario-info">${content}</div>
      </div>`;
      hasNextDiffs = true;
    });

    if (daysHtml) {
      const card = document.createElement('div');
      card.className = 'gruppo-card' + (activeFilter !== 'all' && activeFilter !== g.key ? ' hidden' : '');
      card.dataset.gruppo = g.key;
      card.dataset.week = 'next';
      card.innerHTML = `<div class="gruppo-title">🏀 ${g.label}<span class="gruppo-badge ${g.badgeClass}">${g.category}</span></div>
        <div class="next-week-note">Solo variazioni rispetto al programma standard</div>
        ${daysHtml}`;
      nextCards.push(card);
    }
  });

  if (hasNextDiffs) {
    const divider = document.createElement('div');
    divider.className = 'week-section-label';
    divider.id = 'next-week-divider';
    divider.textContent = `📅 Settimana prossima · ${formatDate(nxStart)} – ${formatDate(nxEnd)}`;
    container.appendChild(divider);
    nextCards.forEach(c => container.appendChild(c));
  }
}

// ADMIN: build edit form
function timeSelectHTML(prefix, groupKey, giorno, value) {
  const hours = Array.from({length: 24}, (_, i) => String(i).padStart(2, '0'));
  const mins = ['00', '15', '30', '45'];
  const parts = value ? value.split(':') : ['', '00'];
  const hVal = parts[0] || '';
  const mVal = mins.includes(parts[1]) ? parts[1] : '00';
  const hOpts = `<option value="">–</option>` + hours.map(h => `<option value="${h}"${h === hVal ? ' selected' : ''}>${h}</option>`).join('');
  const mOpts = mins.map(m => `<option value="${m}"${m === mVal ? ' selected' : ''}>${m}</option>`).join('');
  return `<select class="edit-time-sel edit-time-sel-h" id="${prefix}-h-${groupKey}-${giorno}">${hOpts}</select><span class="time-sep" style="font-size:0.78rem">:</span><select class="edit-time-sel edit-time-sel-m" id="${prefix}-m-${groupKey}-${giorno}">${mOpts}</select>`;
}

function getTimeFromSelects(prefix, groupKey, giorno) {
  const hEl = document.getElementById(`${prefix}-h-${groupKey}-${giorno}`);
  const mEl = document.getElementById(`${prefix}-m-${groupKey}-${giorno}`);
  if (!hEl || !mEl) return '';
  return hEl.value ? `${hEl.value}:${mEl.value}` : '';
}
function buildEditForm() {
  const sel = document.getElementById('edit-group-select');
  if (sel.innerHTML === '') {
    GROUPS.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.key; opt.textContent = g.label;
      sel.appendChild(opt);
    });
  }
  renderEditForm(sel.value);
  sel.addEventListener('change', () => renderEditForm(sel.value));
}

function renderEditForm(groupKey) {
  const g = GROUPS.find(x => x.key === groupKey);
  if (!g) return;
  const form = document.getElementById('edit-form');
  form.innerHTML = '';

  const weekSel = document.getElementById('edit-week-select').value;
  const wk = weekSel === 'next' ? nextWeekKey : (weekSel === 'current' ? currentWeekKey : 'default');
  const existing = weekSel === 'default'
    ? (defaultData[groupKey] || {})
    : ((weekData[wk] && weekData[wk][groupKey]) || defaultData[groupKey] || {});

  const sec = document.createElement('div');
  sec.className = 'edit-group-section';
  sec.innerHTML = `<h4>✏️ ${g.label}</h4>`;

  const wkStartForEdit = weekSel === 'default' ? null
    : weekSel === 'next' ? weekStart(nextWeekKey)
    : weekStart(currentWeekKey);

  ['lunedi','martedi','mercoledi','giovedi','venerdi','sabato'].forEach(giorno => {
    const info = existing[giorno] || { attivo: false, orario: '', nota: '' };
    let dayLabel = GIORNI_IT[giorno];
    if (wkStartForEdit) {
      const dow = GIORNI_DOW[giorno];
      const d = new Date(wkStartForEdit);
      d.setDate(wkStartForEdit.getDate() + ((dow - 1 + 7) % 7));
      dayLabel += ` <span style="font-size:0.68rem;color:#90a4ae;font-weight:400">${formatDate(d)}</span>`;
    }
    const [tStart, tEnd] = parseOrario(info.orario || '');
    const isAttivo = info.attivo;
    const palestraOpts = ['palazzetto','palatenda','palestrina'].map(p =>
      `<option value="${p}"${info.palestra === p ? ' selected' : ''}>${capitalizeFirst(p)}</option>`).join('');
    const row = document.createElement('div'); row.className = 'edit-row';
    row.innerHTML = `
      <label>${dayLabel}</label>
      <input type="checkbox" class="edit-check" id="chk-${groupKey}-${giorno}" ${isAttivo ? 'checked' : ''}/>
      ${timeSelectHTML('orario-start', groupKey, giorno, tStart)}
      <span class="time-sep">–</span>
      ${timeSelectHTML('orario-end', groupKey, giorno, tEnd)}
      <select class="edit-time-sel" id="palestra-${groupKey}-${giorno}" style="width:100px;"><option value="">seleziona una palestra</option>${palestraOpts}</select>
      <input type="text" class="edit-input" id="nota-${groupKey}-${giorno}" placeholder="nota (opz.)" value="${info.nota || ''}"/>`;
    const chkEl = row.querySelector(`#chk-${groupKey}-${giorno}`);
    const startHEl = row.querySelector(`#orario-start-h-${groupKey}-${giorno}`);
    startHEl.addEventListener('change', () => {
      const h = startHEl.value;
      if (h) {
        const endH = String((parseInt(h, 10) + 1) % 24).padStart(2, '0');
        row.querySelector(`#orario-end-h-${groupKey}-${giorno}`).value = endH;
        row.querySelector(`#orario-end-m-${groupKey}-${giorno}`).value =
          row.querySelector(`#orario-start-m-${groupKey}-${giorno}`).value;
      }
    });
    sec.appendChild(row);
  });
  form.appendChild(sec);
}

document.getElementById('save-orari-btn').addEventListener('click', () => {
  const groupKey = document.getElementById('edit-group-select').value;
  const weekSel = document.getElementById('edit-week-select').value;
  const wk = weekSel === 'next' ? nextWeekKey : (weekSel === 'current' ? currentWeekKey : 'default');
  const ref = db.ref(`basket/orari/${wk}/${groupKey}`);
  const data = {};
  let hasError = false;
  ['lunedi','martedi','mercoledi','giovedi','venerdi','sabato'].forEach(giorno => {
    const chk = document.getElementById(`chk-${groupKey}-${giorno}`);
    const tStart = getTimeFromSelects('orario-start', groupKey, giorno);
    const tEnd = getTimeFromSelects('orario-end', groupKey, giorno);
    const nota = document.getElementById(`nota-${groupKey}-${giorno}`).value.trim();
    const palestra = document.getElementById(`palestra-${groupKey}-${giorno}`).value;
    if (chk.checked && (!tStart || !tEnd)) { hasError = true; }
    if (chk.checked && !palestra) { hasError = true; }
    if (!chk.checked && (tStart || tEnd) && !(tStart && tEnd)) { hasError = true; }
    const orario = (tStart && tEnd) ? `${tStart}–${tEnd}` : '';
    data[giorno] = { attivo: chk.checked, orario, nota, palestra };
  });
  if (hasError) { showToast('⚠️ Inserisci orario e palestra per i giorni attivi'); return; }
  ref.set(data)
    .then(() => showToast('✅ Orari salvati!'))
    .catch(() => showToast('❌ Errore nel salvataggio'));
});

// PIN
const pinBtn = document.getElementById('pin-btn');
const overlay = document.getElementById('modal-overlay');
function updatePinBtn() { pinBtn.textContent = isManager() ? '🔐' : '🔒'; }
updatePinBtn();
if (isManager()) { document.getElementById('manager-panel').classList.add('visible'); buildEditForm(); }

pinBtn.addEventListener('click', () => {
  if (isManager()) {
    setManager(false); updatePinBtn();
    document.getElementById('manager-panel').classList.remove('visible');
    renderSchedule(); showToast('🔐 Logout gestore effettuato');
  } else {
    document.getElementById('modal-error').textContent = '';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').type = 'password';
    document.getElementById('pin-toggle').textContent = '👁️';
    overlay.classList.add('open');
    setTimeout(() => document.getElementById('pin-input').focus(), 100);
  }
});
document.getElementById('modal-cancel').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.getElementById('modal-confirm').addEventListener('click', checkPin);
document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
document.getElementById('pin-toggle').addEventListener('click', () => {
  const inp = document.getElementById('pin-input'); const tog = document.getElementById('pin-toggle');
  if (inp.type === 'password') { inp.type = 'text'; tog.textContent = '🙈'; }
  else { inp.type = 'password'; tog.textContent = '👁️'; }
});
function checkPin() {
  if (document.getElementById('pin-input').value === 'basket2026') {
    setManager(true); overlay.classList.remove('open'); updatePinBtn();
    document.getElementById('manager-panel').classList.add('visible');
    buildEditForm(); renderSchedule();
    showToast('🔓 Modalità gestore attiva');
  } else { document.getElementById('modal-error').textContent = '❌ PIN non corretto'; }
}

document.getElementById('edit-week-select').addEventListener('change', () => {
  const sel = document.getElementById('edit-group-select');
  if (sel.value) renderEditForm(sel.value);
});

renderSchedule();
</script>
