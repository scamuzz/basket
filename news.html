<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>📰 Notizie · Basket Visconti</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f5ff; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%);
      color: white; padding: 36px 20px 24px; text-align: center; position: relative; overflow: hidden;
    }
    .header::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.08), transparent); }
    .back-link {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 7px 15px; font-size: 0.76rem; font-weight: 700;
      color: white; text-decoration: none; z-index: 2; backdrop-filter: blur(4px);
    }
    .back-link:hover { background: rgba(255,255,255,0.38); }
    .pin-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.22); border: none; border-radius: 50%;
      width: 40px; height: 40px; font-size: 1.3rem; cursor: pointer; z-index: 2;
      backdrop-filter: blur(4px); color: white; transition: background 0.2s;
    }
    .pin-btn:hover { background: rgba(255,255,255,0.38); }
    .header .icons { font-size: 3rem; display: block; margin-bottom: 10px; position: relative; }
    .header h1 { font-size: 1.6rem; font-weight: 800; position: relative; }
    .header .subtitle { font-size: 0.82rem; opacity: 0.9; margin-top: 6px; position: relative; }
    .sync-status { display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 0.7rem; margin-top: 10px; opacity: 0.95; position: relative; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: white; animation: blink 1.5s infinite; flex-shrink: 0; }
    .sync-dot.connected { background: #69f0ae; animation: none; }
    .sync-dot.error { background: #ff5252; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .wave-divider { display: block; line-height: 0; overflow: hidden;
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%); }
    .wave-divider svg { display: block; width: 100%; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px 12px 64px; }

    /* NEWS CARD */
    .news-card {
      background: white; border-radius: 18px; padding: 18px;
      margin-bottom: 14px; box-shadow: 0 4px 18px rgba(0,51,153,0.07);
      border: 2px solid #c5d5f7; border-left: 5px solid #003399; position: relative;
    }
    .news-card.cat-generale { border-left-color: #003399; }
    .news-card.cat-femm     { border-left-color: #d81b60; }
    .news-card.cat-masc     { border-left-color: #1565c0; }
    .news-card.cat-ann      { border-left-color: #1a5fc8; }
    .news-card.cat-mini     { border-left-color: #f9a825; }
    .news-meta { font-size: 0.68rem; color: #003399; font-weight: 700; margin-bottom: 6px; }
    .news-title { font-size: 1rem; font-weight: 800; color: #1a3a6c; margin-bottom: 8px; }
    .news-text { font-size: 0.85rem; color: #455a64; line-height: 1.65; white-space: pre-line; }
    .news-del-btn {
      position: absolute; top: 14px; right: 14px;
      background: none; border: none; color: #c5d5f7; cursor: pointer;
      font-size: 1rem; transition: color 0.2s;
    }
    .news-del-btn:hover { color: #e53935; }

    .no-news { text-align: center; font-size: 0.88rem; color: #90a4ae; font-style: italic;
      padding: 30px 10px; background: white; border-radius: 16px;
      border: 2px dashed #c5d5f7; margin-bottom: 16px; }
    .section-title { font-size: 0.78rem; font-weight: 800; color: #003399;
      text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 14px 2px;
      display: flex; align-items: center; gap: 6px; }
    .section-title::after { content: ''; flex: 1; height: 2px;
      background: linear-gradient(90deg, #FFCC00 0%, transparent 100%); }

    /* MANAGER PANEL */
    .manager-panel {
      display: none; background: #fff8e1; border-radius: 18px;
      padding: 18px; margin-bottom: 18px; border: 2px solid #ffe082;
    }
    .manager-panel.visible { display: block; }
    .manager-panel h3 { font-size: 0.76rem; color: #f57f17; text-transform: uppercase;
      letter-spacing: 0.9px; font-weight: 800; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 0.75rem; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    .form-input {
      width: 100%; border: 1.5px solid #ffe082; border-radius: 10px;
      padding: 9px 12px; font-size: 0.88rem; font-family: inherit; color: #333; outline: none; background: white;
    }
    .form-input:focus { border-color: #FFCC00; }
    textarea.form-input { min-height: 90px; resize: vertical; }
    .pub-btn {
      width: 100%; background: linear-gradient(135deg, #003399, #1a5fc8); color: white;
      border: none; border-radius: 10px; padding: 11px; font-size: 0.86rem;
      font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit;
    }
    .pub-btn:hover { opacity: 0.9; }

    /* FILTER BAR */
    .filter-bar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 7px 12px; border: 2px solid #c5d5f7; border-radius: 14px;
      background: white; color: #003399; font-size: 0.74rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.18s;
      text-align: center; line-height: 1.3; white-space: nowrap;
    }
    .filter-btn:hover { background: #edf1ff; border-color: #7fa7f0; }
    .filter-btn.active { background: linear-gradient(135deg, #003399, #1a5fc8); color: white; border-color: #003399; }

    /* GROUP BADGE */
    .group-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 800; padding: 2px 8px;
      border-radius: 8px; text-transform: uppercase; letter-spacing: 0.4px; margin-left: 6px; vertical-align: middle;
    }
    .badge-generale { background: #edf1ff; color: #003399; }
    .badge-femm     { background: #fff0f5; color: #8b0040; }
    .badge-masc     { background: #edf1ff; color: #003399; }
    .badge-ann      { background: #e8f4ff; color: #1a5fc8; }
    .badge-mini     { background: #fffde0; color: #7a5f00; }

    /* PIN MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 300px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .modal h3 { font-size: 1rem; font-weight: 800; color: #003399; margin-bottom: 8px; }
    .modal p { font-size: 0.78rem; color: #607d8b; margin-bottom: 16px; }
    .modal input { width: 100%; border: 2px solid #c5d5f7; border-radius: 10px;
      padding: 11px 40px 11px 14px; font-size: 1rem; text-align: center;
      letter-spacing: 2px; outline: none; font-family: inherit; }
    .modal input:focus { border-color: #003399; }
    .pin-input-wrap { position: relative; }
    .pin-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; line-height: 1; }
    .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: 10px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .modal-btn.primary { background: linear-gradient(135deg, #003399, #1a5fc8); color: white; }
    .modal-btn.secondary { background: #eceff1; color: #607d8b; }
    .modal-error { font-size: 0.75rem; color: #e53935; margin-top: 8px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #003399; color: white; padding: 10px 22px; border-radius: 24px;
      font-size: 0.83rem; font-weight: 600; transition: transform 0.3s ease; z-index: 999;
      box-shadow: 0 6px 24px rgba(0,51,153,0.3); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .page-footer { text-align: center; font-size: 0.7rem; color: #aabbc8; padding: 20px 0; }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">&#8592; Home</a>
  <button class="pin-btn" id="pin-btn">🔒</button>
  <span class="icons">📰</span>
  <h1>Notizie &amp; Avvisi</h1>
  <div class="subtitle">Comunicazioni Basket Visconti Brignano</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso…</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#f0f5ff"/>
  </svg>
</div>

<div class="container">

  <div class="manager-panel" id="manager-panel">
    <h3>✏️ Pubblica una comunicazione</h3>
    <div class="form-group">
      <label>Squadra destinataria</label>
      <select class="form-input" id="news-group">
        <option value="generale">📰 Tutte le squadre (generale)</option>
        <optgroup label="Femminili">
          <option value="prom_f">Promozione ♀</option>
          <option value="u17_f">Under 17 ♀</option>
          <option value="u15_f">Under 15 ♀</option>
        </optgroup>
        <optgroup label="Maschili">
          <option value="dr1">Div. Reg. 1 ♂</option>
          <option value="dr4">Div. Reg. 4 ♂</option>
        </optgroup>
        <optgroup label="Annate">
          <option value="a2010">2010</option>
          <option value="a2011">2011</option>
          <option value="a2012">2012</option>
          <option value="a2013">2013</option>
          <option value="a2014">2014</option>
          <option value="a2015">2015</option>
        </optgroup>
        <optgroup label="Minibasket">
          <option value="m2016">Mini 2016</option>
          <option value="m2017">Mini 2017</option>
          <option value="m2018">Mini 2018</option>
          <option value="m2019">Mini 2019</option>
          <option value="m2021">Mini 2020-21</option>
          <option value="m2023">Mini 2022-23</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group">
      <label>Titolo</label>
      <input type="text" class="form-input" id="news-title" placeholder="Titolo della comunicazione…" maxlength="100"/>
    </div>
    <div class="form-group">
      <label>Testo</label>
      <textarea class="form-input" id="news-text" placeholder="Scrivi il messaggio…"></textarea>
    </div>
    <button class="pub-btn" id="pub-btn">📤 Pubblica comunicazione</button>
  </div>

  <!-- FILTRI -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="tutti">🌐 Tutti</button>
    <button class="filter-btn" data-filter="generale">📰 Generale</button>
    <button class="filter-btn" data-filter="prom_f">Prom ♀</button>
    <button class="filter-btn" data-filter="u17_f">U17 ♀</button>
    <button class="filter-btn" data-filter="u15_f">U15 ♀</button>
    <button class="filter-btn" data-filter="dr1">DR1 ♂</button>
    <button class="filter-btn" data-filter="dr4">DR4 ♂</button>
    <button class="filter-btn" data-filter="a2010">2010</button>
    <button class="filter-btn" data-filter="a2011">2011</button>
    <button class="filter-btn" data-filter="a2012">2012</button>
    <button class="filter-btn" data-filter="a2013">2013</button>
    <button class="filter-btn" data-filter="a2014">2014</button>
    <button class="filter-btn" data-filter="a2015">2015</button>
    <button class="filter-btn" data-filter="m2016">Mini 2016</button>
    <button class="filter-btn" data-filter="m2017">Mini 2017</button>
    <button class="filter-btn" data-filter="m2018">Mini 2018</button>
    <button class="filter-btn" data-filter="m2019">Mini 2019</button>
    <button class="filter-btn" data-filter="m2021">Mini 20-21</button>
    <button class="filter-btn" data-filter="m2023">Mini 22-23</button>
  </div>

  <div class="section-title">📢 Comunicazioni e Avvisi</div>
  <div id="news-container"></div>
</div>

<div class="page-footer">📰 Notizie · Basket Visconti Brignano</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>🔑 Accesso Gestore</h3>
    <p>Inserisci il PIN per pubblicare comunicazioni</p>
    <div class="pin-input-wrap">
      <input type="password" id="pin-input" placeholder="••••••••" maxlength="20" autocomplete="current-password"/>
      <button class="pin-toggle" id="pin-toggle" type="button">👁️</button>
    </div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-btns">
      <button class="modal-btn secondary" id="modal-cancel">Annulla</button>
      <button class="modal-btn primary" id="modal-confirm">Accedi</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
  authDomain: "lista-spesa-b9eb1.firebaseapp.com",
  databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lista-spesa-b9eb1",
  storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
  messagingSenderId: "468690890938",
  appId: "1:468690890938:web:048be7f27779d8862d9283"
});
const db = firebase.database();

// Group definitions for news
const GROUP_DEFS = [
  { key: 'generale', label: 'Generale',     icon: '📰', badgeClass: 'badge-generale', cardClass: 'cat-generale' },
  { key: 'prom_f',   label: 'Promozione ♀', icon: '🏀', badgeClass: 'badge-femm',     cardClass: 'cat-femm' },
  { key: 'u17_f',    label: 'Under 17 ♀',   icon: '🏀', badgeClass: 'badge-femm',     cardClass: 'cat-femm' },
  { key: 'u15_f',    label: 'Under 15 ♀',   icon: '🏀', badgeClass: 'badge-femm',     cardClass: 'cat-femm' },
  { key: 'dr1',      label: 'DR1 ♂',         icon: '🏀', badgeClass: 'badge-masc',     cardClass: 'cat-masc' },
  { key: 'dr4',      label: 'DR4 ♂',         icon: '🏀', badgeClass: 'badge-masc',     cardClass: 'cat-masc' },
  { key: 'a2010',    label: '2010',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'a2011',    label: '2011',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'a2012',    label: '2012',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'a2013',    label: '2013',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'a2014',    label: '2014',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'a2015',    label: '2015',           icon: '🏀', badgeClass: 'badge-ann',      cardClass: 'cat-ann' },
  { key: 'm2016',    label: 'Mini 2016',      icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
  { key: 'm2017',    label: 'Mini 2017',      icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
  { key: 'm2018',    label: 'Mini 2018',      icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
  { key: 'm2019',    label: 'Mini 2019',      icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
  { key: 'm2021',    label: 'Mini 2020-21',   icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
  { key: 'm2023',    label: 'Mini 2022-23',   icon: '⭐', badgeClass: 'badge-mini',     cardClass: 'cat-mini' },
];

const GROUPS = {};
GROUP_DEFS.forEach(g => {
  GROUPS[g.key] = { ...g, ref: db.ref(`basket/news/${g.key}`) };
});

let allData = {};
GROUP_DEFS.forEach(g => { allData[g.key] = {}; });
let activeFilter = 'tutti';

function isManager() { return localStorage.getItem('basketManager') === '1'; }
function setManager(v) { localStorage.setItem('basketManager', v ? '1' : '0'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

db.ref('.info/connected').on('value', snap => {
  const dot = document.getElementById('sync-dot'), lbl = document.getElementById('sync-label');
  if (snap.val()) { dot.className='sync-dot connected'; lbl.textContent='✅ Sincronizzato in tempo reale'; }
  else { dot.className='sync-dot error'; lbl.textContent='❌ Offline – riconnessione…'; }
});

GROUP_DEFS.forEach(({ key }) => {
  GROUPS[key].ref.orderByChild('data').on('value', snap => {
    allData[key] = snap.val() || {};
    renderNews();
  });
});

function renderNews() {
  const container = document.getElementById('news-container');
  let entries = [];

  if (activeFilter === 'tutti') {
    GROUP_DEFS.forEach(({ key }) => {
      Object.entries(allData[key]).forEach(([id, item]) => { entries.push({ id, item, group: key }); });
    });
  } else {
    Object.entries(allData[activeFilter]).forEach(([id, item]) => {
      entries.push({ id, item, group: activeFilter });
    });
  }

  entries.sort((a, b) => (b.item.data || '').localeCompare(a.item.data || ''));

  if (entries.length === 0) {
    container.innerHTML = '<div class="no-news">Nessuna comunicazione al momento. 🏀</div>'; return;
  }

  container.innerHTML = '';
  entries.forEach(({ id, item, group }) => {
    const g = GROUPS[group];
    const d = new Date(item.data);
    const dateStr = isNaN(d) ? item.data : d.toLocaleDateString('it-IT', { day:'2-digit', month:'long', year:'numeric' });
    const badgeHtml = activeFilter === 'tutti'
      ? `<span class="group-badge ${esc(g.badgeClass)}">${g.icon} ${esc(g.label)}</span>`
      : '';
    const card = document.createElement('div');
    card.className = `news-card ${esc(g.cardClass)}`;
    card.dataset.group = group; card.dataset.id = id;
    card.innerHTML = `<div class="news-meta">📅 ${esc(dateStr)}${badgeHtml}</div>
      <div class="news-title">${esc(item.titolo)}</div>
      <div class="news-text">${esc(item.testo)}</div>
      ${isManager() ? `<button class="news-del-btn" title="Elimina">🗑️</button>` : ''}`;
    container.appendChild(card);
  });

  if (isManager()) {
    document.querySelectorAll('.news-del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cardEl = btn.closest('.news-card');
        if (confirm('Eliminare questa comunicazione?')) {
          GROUPS[cardEl.dataset.group].ref.child(cardEl.dataset.id).remove();
          showToast('✅ Comunicazione eliminata');
        }
      });
    });
  }
}

// Filtri
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderNews();
  });
});

document.getElementById('pub-btn').addEventListener('click', () => {
  const group  = document.getElementById('news-group').value;
  const titolo = document.getElementById('news-title').value.trim();
  const testo  = document.getElementById('news-text').value.trim();
  if (!titolo) { showToast('⚠️ Inserisci un titolo!'); return; }
  if (!testo)  { showToast('⚠️ Inserisci il testo!'); return; }
  GROUPS[group].ref.push({ titolo, testo, data: new Date().toISOString().slice(0,10) })
    .then(() => {
      document.getElementById('news-title').value = '';
      document.getElementById('news-text').value = '';
      showToast('✅ Comunicazione pubblicata!');
    }).catch(() => showToast('❌ Errore nel salvataggio'));
});

// PIN
const pinBtn = document.getElementById('pin-btn');
const overlay = document.getElementById('modal-overlay');
function updatePinBtn() { pinBtn.textContent = isManager() ? '🔐' : '🔒'; }
updatePinBtn();
if (isManager()) document.getElementById('manager-panel').classList.add('visible');

pinBtn.addEventListener('click', () => {
  if (isManager()) {
    setManager(false);
    document.getElementById('manager-panel').classList.remove('visible');
    updatePinBtn(); renderNews(); showToast('👋 Logout gestore effettuato');
  } else {
    document.getElementById('modal-error').textContent = '';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').type = 'password';
    document.getElementById('pin-toggle').textContent = '👁️';
    overlay.classList.add('open');
    setTimeout(() => document.getElementById('pin-input').focus(), 100);
  }
});
document.getElementById('modal-cancel').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.getElementById('modal-confirm').addEventListener('click', checkPin);
document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
document.getElementById('pin-toggle').addEventListener('click', () => {
  const inp = document.getElementById('pin-input'), tog = document.getElementById('pin-toggle');
  if (inp.type === 'password') { inp.type = 'text'; tog.textContent = '🙈'; }
  else { inp.type = 'password'; tog.textContent = '👁️'; }
});
function checkPin() {
  if (document.getElementById('pin-input').value === 'basket2026') {
    setManager(true); overlay.classList.remove('open');
    document.getElementById('manager-panel').classList.add('visible');
    updatePinBtn(); renderNews(); showToast('✅ Modalità gestore attiva');
  } else { document.getElementById('modal-error').textContent = '❌ PIN non corretto'; }
}
</script>
