<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Gestione Squadre · A.S.D. Visconti Basket Brignano</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f5ff; min-height: 100vh; }

    .header {
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%);
      color: white; padding: 36px 20px 24px; text-align: center; position: relative; overflow: hidden;
      border-bottom: 4px solid #FFCC00;
    }
    .header::before { content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 30%, rgba(255,255,255,0.08), transparent); }
    .back-link {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.22); border-radius: 20px;
      padding: 7px 15px; font-size: 0.76rem; font-weight: 700;
      color: white; text-decoration: none; z-index: 2; backdrop-filter: blur(4px);
    }
    .back-link:hover { background: rgba(255,255,255,0.38); }
    .pin-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.22); border: none; border-radius: 50%;
      width: 40px; height: 40px; font-size: 1.3rem; cursor: pointer; z-index: 2;
      backdrop-filter: blur(4px); color: white; transition: background 0.2s;
    }
    .pin-btn:hover { background: rgba(255,255,255,0.38); }
    .header .icons { font-size: 3rem; display: block; margin-bottom: 10px; position: relative; }
    .header h1 { font-size: 1.6rem; font-weight: 800; position: relative; }
    .header .subtitle { font-size: 0.82rem; opacity: 0.9; margin-top: 6px; position: relative; }
    .sync-status { display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 0.7rem; margin-top: 10px; opacity: 0.95; position: relative; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: white; animation: blink 1.5s infinite; flex-shrink: 0; }
    .sync-dot.connected { background: #69f0ae; animation: none; }
    .sync-dot.error { background: #ff5252; animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    .wave-divider { display: block; line-height: 0; overflow: hidden;
      background: linear-gradient(160deg, #001f6b 0%, #003399 50%, #1a5fc8 100%); }
    .wave-divider svg { display: block; width: 100%; }
    .container { max-width: 540px; margin: 0 auto; padding: 16px 12px 64px; }

    /* MANAGER PANEL */
    .manager-panel {
      display: none; background: #fff8e1; border-radius: 18px;
      padding: 18px; margin-bottom: 18px; border: 2px solid #ffe082;
    }
    .manager-panel.visible { display: block; }
    .manager-panel h3 { font-size: 0.76rem; color: #f57f17; text-transform: uppercase;
      letter-spacing: 0.9px; font-weight: 800; margin-bottom: 12px; }
    .new-team-btn {
      width: 100%; background: #fff; color: #003399; border: 2px dashed #ffcc00;
      border-radius: 10px; padding: 10px 12px; font-size: 0.83rem; font-weight: 800;
      cursor: pointer; font-family: inherit; margin-bottom: 12px;
    }
    .new-team-btn:hover { background: #fffde7; }
    .add-team-form { display: none; }
    .add-team-form.open { display: block; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 0.75rem; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    .form-input {
      width: 100%; border: 1.5px solid #ffe082; border-radius: 10px;
      padding: 9px 12px; font-size: 0.88rem; font-family: inherit; color: #333; outline: none; background: white;
    }
    .form-input:focus { border-color: #FFCC00; }
    textarea.form-input { min-height: 70px; resize: vertical; }
    .pub-btn {
      width: 100%; background: linear-gradient(135deg, #003399, #1a5fc8); color: white;
      border: none; border-radius: 10px; padding: 11px; font-size: 0.86rem;
      font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit;
    }
    .pub-btn:hover { opacity: 0.9; }

    /* SECTION TITLE */
    .section-title {
      font-size: 0.78rem; font-weight: 800; color: #003399;
      text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 2px;
      display: flex; align-items: center; gap: 6px;
    }
    .section-title::after { content: ''; flex: 1; height: 2px;
      background: linear-gradient(90deg, #FFCC00 0%, transparent 100%); }

    /* SQUADRA ITEM */
    .squadra-item {
      background: white; border-radius: 14px; padding: 13px 14px;
      margin-bottom: 9px; display: flex; align-items: flex-start; justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,51,153,0.06); border: 2px solid #c5d5f7;
    }
    .squadra-info { flex: 1; min-width: 0; }
    .squadra-nome { font-size: 0.92rem; font-weight: 800; color: #1a3a6c; }
    .squadra-badge {
      display: inline-block; font-size: 0.60rem; font-weight: 800; padding: 2px 8px;
      border-radius: 8px; margin-left: 7px; vertical-align: middle;
    }
    .badge-femm { background: #fff0f5; color: #8b0040; }
    .badge-masc { background: #edf1ff; color: #003399; }
    .badge-ann  { background: #e8f4ff; color: #1a5fc8; }
    .badge-mini { background: #fffde0; color: #7a5f00; }
    .badge-gen  { background: #f0f5ff; color: #455a64; }
    .squadra-desc { font-size: 0.76rem; color: #607d8b; margin-top: 4px; line-height: 1.5; }
    .squadra-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 10px; }
    .action-btn {
      background: none; border: none; color: #b0bec5; cursor: pointer;
      font-size: 1rem; transition: color 0.2s; padding: 2px 4px;
    }
    .action-btn:hover { color: #003399; }
    .action-btn.del:hover { color: #e53935; }

    .no-items { text-align: center; font-size: 0.88rem; color: #90a4ae; font-style: italic;
      padding: 30px 10px; background: white; border-radius: 16px;
      border: 2px dashed #c5d5f7; margin-bottom: 16px; }

    /* PIN MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 28px 24px;
      max-width: 320px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .modal h3 { font-size: 1rem; font-weight: 800; color: #003399; margin-bottom: 8px; }
    .modal p { font-size: 0.78rem; color: #607d8b; margin-bottom: 16px; }
    .modal input { width: 100%; border: 2px solid #c5d5f7; border-radius: 10px;
      padding: 11px 40px 11px 14px; font-size: 1rem; text-align: center;
      letter-spacing: 2px; outline: none; font-family: inherit; }
    .modal input:focus { border-color: #003399; }
    .pin-input-wrap { position: relative; }
    .pin-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; line-height: 1; }
    .modal-btns { display: flex; gap: 10px; margin-top: 14px; }
    .modal-btn { flex: 1; padding: 11px; border: none; border-radius: 10px;
      font-size: 0.86rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .modal-btn.primary { background: linear-gradient(135deg, #003399, #1a5fc8); color: white; }
    .modal-btn.secondary { background: #eceff1; color: #607d8b; }
    .modal-error { font-size: 0.75rem; color: #e53935; margin-top: 8px; }

    /* EDIT MODAL */
    .edit-modal { background: white; border-radius: 20px; padding: 24px 22px;
      max-width: 360px; width: 92%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: left; }
    .edit-modal h3 { font-size: 0.9rem; font-weight: 800; color: #003399; margin-bottom: 16px; text-align: center; }
    .edit-form-group { margin-bottom: 11px; }
    .edit-form-group label { font-size: 0.75rem; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
    .edit-input {
      width: 100%; border: 1.5px solid #c5d5f7; border-radius: 10px;
      padding: 9px 12px; font-size: 0.88rem; font-family: inherit; color: #333; outline: none; background: white;
    }
    .edit-input:focus { border-color: #003399; }
    textarea.edit-input { min-height: 65px; resize: vertical; }
    .edit-error { font-size: 0.75rem; color: #e53935; margin-top: 6px; min-height: 18px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #003399; color: white; padding: 10px 22px; border-radius: 24px;
      font-size: 0.83rem; font-weight: 600; transition: transform 0.3s ease; z-index: 999;
      box-shadow: 0 6px 24px rgba(0,51,153,0.3); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .page-footer { text-align: center; font-size: 0.7rem; color: #aabbc8; padding: 20px 0; }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">&#8592; Home</a>
  <button class="pin-btn" id="pin-btn">🔒</button>
  <span class="icons">🏅</span>
  <h1>Gestione Squadre</h1>
  <div class="subtitle">A.S.D. Visconti Basket Brignano</div>
  <div class="sync-status">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">Connessione in corso…</span>
  </div>
</div>

<div class="wave-divider">
  <svg viewBox="0 0 1440 72" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,36 C180,72 360,0 540,36 C720,72 900,0 1080,36 C1260,72 1380,12 1440,36 L1440,72 L0,72 Z" fill="#f0f5ff"/>
  </svg>
</div>

<div class="container">

  <!-- PANNELLO AGGIUNTA (solo admin) -->
  <div class="manager-panel" id="manager-panel">
    <button class="new-team-btn" id="toggle-add-form-btn" type="button" aria-expanded="false" aria-controls="add-team-form">➕ Nuova Squadra</button>
    <div class="add-team-form" id="add-team-form" role="region" aria-hidden="true" aria-labelledby="toggle-add-form-btn">
      <h3>➕ Aggiungi una squadra</h3>
      <div class="form-group">
        <label>Categoria <span style="color:#e53935">*</span></label>
        <select class="form-input" id="add-categoria">
          <option value="">— Seleziona una categoria —</option>
          <option value="Femminili">⛹️‍♀️ Femminili</option>
          <option value="Senior">⛹️‍♂️ Senior</option>
          <option value="Giovanili">🏀 Giovanili</option>
          <option value="Minibasket">⭐ Minibasket</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nome squadra <span style="color:#e53935">*</span></label>
        <input type="text" class="form-input" id="add-nome" placeholder="Es. Under 15 ⛹️‍♀️" maxlength="80"/>
      </div>
      <div class="form-group">
        <label>Descrizione <span style="color:#90a4ae">(opzionale)</span></label>
        <textarea class="form-input" id="add-descrizione" placeholder="Breve descrizione della squadra…" maxlength="300"></textarea>
      </div>
      <button class="pub-btn" id="add-btn">➕ Aggiungi squadra</button>
    </div>
  </div>

  <!-- LISTA SQUADRE -->
  <div id="squadre-container"></div>

</div>

<div class="page-footer">🏅 Gestione Squadre · A.S.D. Visconti Basket Brignano</div>
<div class="toast" id="toast"></div>

<!-- PIN MODAL -->
<div class="modal-overlay" id="pin-overlay">
  <div class="modal">
    <h3>🔑 Accesso Amministratore</h3>
    <p>Inserisci il PIN per gestire le squadre</p>
    <div class="pin-input-wrap">
      <input type="password" id="pin-input" placeholder="••••••••" maxlength="20" autocomplete="current-password"/>
      <button class="pin-toggle" id="pin-toggle" type="button">👁️</button>
    </div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-btns">
      <button class="modal-btn secondary" id="modal-cancel">Annulla</button>
      <button class="modal-btn primary" id="modal-confirm">Accedi</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-overlay">
  <div class="edit-modal">
    <h3>✏️ Modifica squadra</h3>
    <div class="edit-form-group">
      <label>Categoria <span style="color:#e53935">*</span></label>
      <select class="edit-input" id="edit-categoria">
        <option value="">— Seleziona una categoria —</option>
        <option value="Femminili">⛹️‍♀️ Femminili</option>
        <option value="Senior">⛹️‍♂️ Senior</option>
        <option value="Giovanili">🏀 Giovanili</option>
        <option value="Minibasket">⭐ Minibasket</option>
      </select>
    </div>
    <div class="edit-form-group">
      <label>Nome squadra <span style="color:#e53935">*</span></label>
      <input type="text" class="edit-input" id="edit-nome" maxlength="80"/>
    </div>
    <div class="edit-form-group">
      <label>Descrizione <span style="color:#90a4ae">(opzionale)</span></label>
      <textarea class="edit-input" id="edit-descrizione" maxlength="300"></textarea>
    </div>
    <div class="edit-error" id="edit-error"></div>
    <div class="modal-btns">
      <button class="modal-btn secondary" id="edit-cancel">Annulla</button>
      <button class="modal-btn primary" id="edit-save">💾 Salva</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAfOMeAkXUIandLUhCR8nfyELOPVRyD3WU",
  authDomain: "lista-spesa-b9eb1.firebaseapp.com",
  databaseURL: "https://lista-spesa-b9eb1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "lista-spesa-b9eb1",
  storageBucket: "lista-spesa-b9eb1.firebasestorage.app",
  messagingSenderId: "468690890938",
  appId: "1:468690890938:web:048be7f27779d8862d9283"
});
const db = firebase.database();
const squadreRef = db.ref('basket/squadre');

// Dati iniziali (squadre esistenti da inizializzare nel DB se vuoto)
const INITIAL_SQUADRE = [
  { key: 'prom_f', categoria: 'Femminili',  nome: 'Promozione ⛹️‍♀️',  descrizione: '' },
  { key: 'u17_f',  categoria: 'Femminili',  nome: 'Under 17 ⛹️‍♀️',    descrizione: '' },
  { key: 'u15_f',  categoria: 'Femminili',  nome: 'Under 15 ⛹️‍♀️',    descrizione: '' },
  { key: 'dr1',    categoria: 'Senior',     nome: 'Div. Reg. 1 ⛹️‍♂️', descrizione: '' },
  { key: 'dr4',    categoria: 'Senior',     nome: 'Div. Reg. 4 ⛹️‍♂️', descrizione: '' },
  { key: 'a2010',  categoria: 'Giovanili',  nome: '2010',             descrizione: '' },
  { key: 'a2011',  categoria: 'Giovanili',  nome: '2011',             descrizione: '' },
  { key: 'a2012',  categoria: 'Giovanili',  nome: '2012',             descrizione: '' },
  { key: 'a2013',  categoria: 'Giovanili',  nome: '2013',             descrizione: '' },
  { key: 'a2014',  categoria: 'Giovanili',  nome: '2014',             descrizione: '' },
  { key: 'a2015',  categoria: 'Giovanili',  nome: '2015',             descrizione: '' },
  { key: 'm2016',  categoria: 'Minibasket', nome: 'Mini 2016',       descrizione: '' },
  { key: 'm2017',  categoria: 'Minibasket', nome: 'Mini 2017',       descrizione: '' },
  { key: 'm2018',  categoria: 'Minibasket', nome: 'Mini 2018',       descrizione: '' },
  { key: 'm2019',  categoria: 'Minibasket', nome: 'Mini 2019',       descrizione: '' },
  { key: 'm2021',  categoria: 'Minibasket', nome: 'Mini 2020-21',    descrizione: '' },
  { key: 'm2023',  categoria: 'Minibasket', nome: 'Mini 2022-23',    descrizione: '' },
];

const CATEGORY_ORDER = ['Femminili', 'Senior', 'Giovanili', 'Minibasket'];
const CATEGORY_BADGE = {
  'Femminili':  'badge-femm',
  'Senior':     'badge-masc',
  'Giovanili':  'badge-ann',
  'Minibasket': 'badge-mini',
};

function isManager() { return localStorage.getItem('basketManager') === '1'; }
function setManager(v) { localStorage.setItem('basketManager', v ? '1' : '0'); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// Connessione Firebase
db.ref('.info/connected').on('value', snap => {
  const dot = document.getElementById('sync-dot'), lbl = document.getElementById('sync-label');
  if (snap.val()) { dot.className='sync-dot connected'; lbl.textContent='✅ Sincronizzato in tempo reale'; }
  else { dot.className='sync-dot error'; lbl.textContent='❌ Offline – riconnessione…'; }
});

// Inizializza DB se vuoto
squadreRef.once('value', snap => {
  if (!snap.val()) {
    const initialData = {};
    INITIAL_SQUADRE.forEach(s => {
      initialData[s.key] = { categoria: s.categoria, nome: s.nome, descrizione: s.descrizione };
    });
    squadreRef.set(initialData);
  }
});

let allSquadre = {};

squadreRef.on('value', snap => {
  allSquadre = snap.val() || {};
  render();
});

function render() {
  const container = document.getElementById('squadre-container');
  container.innerHTML = '';
  const admin = isManager();

  // Raggruppa per categoria
  const grouped = {};
  Object.entries(allSquadre).forEach(([key, s]) => {
    const cat = s.categoria || 'Altro';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push({ key, ...s });
  });

  // Ordine categorie
  const orderedCats = [
    ...CATEGORY_ORDER.filter(c => grouped[c]),
    ...Object.keys(grouped).filter(c => !CATEGORY_ORDER.includes(c)).sort(),
  ];

  if (orderedCats.length === 0) {
    container.innerHTML = '<div class="no-items">Nessuna squadra presente. 🏀</div>';
    return;
  }

  orderedCats.forEach(cat => {
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = cat;
    container.appendChild(title);

    const teams = grouped[cat].sort((a, b) => (a.nome||'').localeCompare(b.nome||''));
    teams.forEach(s => {
      const badgeClass = CATEGORY_BADGE[s.categoria] || 'badge-gen';
      const item = document.createElement('div');
      item.className = 'squadra-item';
      item.innerHTML = `
        <div class="squadra-info">
          <span class="squadra-nome">${esc(s.nome)}</span>
          ${s.descrizione ? `<div class="squadra-desc">${esc(s.descrizione)}</div>` : ''}
        </div>
        ${admin ? `
        <div class="squadra-actions">
          <button class="action-btn edit-btn" data-key="${esc(s.key)}" title="Modifica">✏️</button>
          <button class="action-btn del del-btn" data-key="${esc(s.key)}" data-nome="${esc(s.nome)}" title="Elimina">🗑️</button>
        </div>` : ''}`;
      container.appendChild(item);
    });
  });

  if (admin) {
    container.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(btn.dataset.key));
    });
    container.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm(`Eliminare la squadra "${btn.dataset.nome}"?`)) {
          squadreRef.child(btn.dataset.key).remove()
            .then(() => showToast('✅ Squadra eliminata'))
            .catch(() => showToast('❌ Errore nella rimozione'));
        }
      });
    });
  }
}

// --- AGGIUNTA ---
document.getElementById('add-btn').addEventListener('click', () => {
  const categoria = document.getElementById('add-categoria').value.trim();
  const nome      = document.getElementById('add-nome').value.trim();
  const descrizione = document.getElementById('add-descrizione').value.trim();
  if (!categoria) { showToast('⚠️ Seleziona una categoria!'); return; }
  if (!nome)      { showToast('⚠️ Inserisci il nome della squadra!'); return; }
  squadreRef.push({ categoria, nome, descrizione })
    .then(() => {
      document.getElementById('add-categoria').value = '';
      document.getElementById('add-nome').value = '';
      document.getElementById('add-descrizione').value = '';
      showToast('✅ Squadra aggiunta!');
    })
    .catch(() => showToast('❌ Errore nel salvataggio'));
});

// --- MODIFICA ---
let editKey = null;

function openEditModal(key) {
  const s = allSquadre[key];
  if (!s) return;
  editKey = key;
  document.getElementById('edit-categoria').value = s.categoria || '';
  document.getElementById('edit-nome').value = s.nome || '';
  document.getElementById('edit-descrizione').value = s.descrizione || '';
  document.getElementById('edit-error').textContent = '';
  document.getElementById('edit-overlay').classList.add('open');
  setTimeout(() => document.getElementById('edit-nome').focus(), 100);
}

document.getElementById('edit-cancel').addEventListener('click', () => {
  document.getElementById('edit-overlay').classList.remove('open');
  editKey = null;
});
document.getElementById('edit-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-overlay')) {
    document.getElementById('edit-overlay').classList.remove('open');
    editKey = null;
  }
});

document.getElementById('edit-save').addEventListener('click', () => {
  const categoria  = document.getElementById('edit-categoria').value.trim();
  const nome       = document.getElementById('edit-nome').value.trim();
  const descrizione = document.getElementById('edit-descrizione').value.trim();
  const errEl = document.getElementById('edit-error');
  if (!categoria) { errEl.textContent = '⚠️ Seleziona una categoria'; return; }
  if (!nome)      { errEl.textContent = '⚠️ Inserisci il nome della squadra'; return; }
  errEl.textContent = '';
  squadreRef.child(editKey).update({ categoria, nome, descrizione })
    .then(() => {
      document.getElementById('edit-overlay').classList.remove('open');
      editKey = null;
      showToast('✅ Squadra modificata!');
    })
    .catch(() => { errEl.textContent = '❌ Errore nel salvataggio'; });
});

// --- PIN ---
const pinBtn = document.getElementById('pin-btn');
const pinOverlay = document.getElementById('pin-overlay');
const managerPanel = document.getElementById('manager-panel');
const addTeamForm = document.getElementById('add-team-form');
const toggleAddFormBtn = document.getElementById('toggle-add-form-btn');
const addCategoriaInput = document.getElementById('add-categoria');
const FOCUS_DELAY_MS = 100; // attende il rendering del form prima del focus
const TOGGLE_ADD_FORM_OPEN_TEXT = '➕ Nuova Squadra';
const TOGGLE_ADD_FORM_CLOSE_TEXT = '✖ Chiudi form';

function closeAddTeamForm() {
  addTeamForm.classList.remove('open');
  toggleAddFormBtn.textContent = TOGGLE_ADD_FORM_OPEN_TEXT;
  toggleAddFormBtn.setAttribute('aria-expanded', 'false');
  addTeamForm.setAttribute('aria-hidden', 'true');
}

toggleAddFormBtn.addEventListener('click', () => {
  const isOpen = addTeamForm.classList.toggle('open');
  toggleAddFormBtn.textContent = isOpen ? TOGGLE_ADD_FORM_CLOSE_TEXT : TOGGLE_ADD_FORM_OPEN_TEXT;
  toggleAddFormBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  addTeamForm.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
  if (isOpen) setTimeout(() => addCategoriaInput.focus(), FOCUS_DELAY_MS);
  else toggleAddFormBtn.focus();
});

function updatePinBtn() { pinBtn.textContent = isManager() ? '🔐' : '🔒'; }
updatePinBtn();
if (isManager()) managerPanel.classList.add('visible');

pinBtn.addEventListener('click', () => {
  if (isManager()) {
    setManager(false);
    managerPanel.classList.remove('visible');
    closeAddTeamForm();
    updatePinBtn(); render(); showToast('🔐 Logout gestore effettuato');
  } else {
    document.getElementById('modal-error').textContent = '';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').type = 'password';
    document.getElementById('pin-toggle').textContent = '👁️';
    pinOverlay.classList.add('open');
    setTimeout(() => document.getElementById('pin-input').focus(), 100);
  }
});
document.getElementById('modal-cancel').addEventListener('click', () => pinOverlay.classList.remove('open'));
pinOverlay.addEventListener('click', e => { if (e.target === pinOverlay) pinOverlay.classList.remove('open'); });
document.getElementById('modal-confirm').addEventListener('click', checkPin);
document.getElementById('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
document.getElementById('pin-toggle').addEventListener('click', () => {
  const inp = document.getElementById('pin-input'), tog = document.getElementById('pin-toggle');
  if (inp.type === 'password') { inp.type = 'text'; tog.textContent = '🙈'; }
  else { inp.type = 'password'; tog.textContent = '👁️'; }
});
function checkPin() {
  if (document.getElementById('pin-input').value === 'basket2026') {
    setManager(true); pinOverlay.classList.remove('open');
    managerPanel.classList.add('visible');
    closeAddTeamForm();
    updatePinBtn(); render(); showToast('🔓 Modalità gestore attiva');
  } else { document.getElementById('modal-error').textContent = '❌ PIN non corretto'; }
}
</script>
